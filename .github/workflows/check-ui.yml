name: UI checks
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      # Pastikan Vite tetap memasang WebP saat build dijalankan langsung,
      # sebagaimana mungkin dilakukan oleh Cloudflare Pages.
      - run: |
          rm -rf public/empty-states dist
          npx vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      - run: node --test scripts/push-error-messages.test.mjs scripts/pwa-build.test.mjs scripts/staff-account-import-regression.test.mjs scripts/empty-state-build.test.mjs scripts/admin-reminder-controls.test.mjs scripts/scheduler-reminder-readiness.test.mjs scripts/notification-popover-badge.test.mjs scripts/admin-phone-request-identity.test.mjs scripts/activation-batch.test.mjs scripts/notifications-auto-resolve.test.mjs scripts/recovery-chat-ui-refresh.test.mjs scripts/recovery-chat-theme.test.mjs scripts/forgot-password-mobile-layout.test.mjs scripts/login-password-visibility.test.mjs scripts/recovery-chat-realtime.test.mjs scripts/fast-startup-and-thread-delete.test.mjs scripts/splash-five-second-cap.test.mjs scripts/recovery-chat-permission-reuse.test.mjs scripts/parents-class-group-dialogs.test.mjs scripts/parent-shared-phone-auto-link.test.mjs scripts/popup-auto-close-audit.test.mjs scripts/notification-staff-rapor-cleanup.test.mjs scripts/parent-push-admin-link-ui.test.mjs scripts/popup-audit-followup-20261025.test.mjs scripts/notification-profile-report-screenshots.test.mjs
