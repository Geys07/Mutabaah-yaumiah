name: UI checks
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      # Pastikan Vite tetap memasang WebP saat build dijalankan langsung,
      # sebagaimana mungkin dilakukan oleh Cloudflare Pages.
      - run: |
          rm -rf public/empty-states dist
          npx vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      - run: node --test scripts/push-error-messages.test.mjs scripts/pwa-build.test.mjs scripts/staff-account-import-regression.test.mjs scripts/empty-state-build.test.mjs scripts/admin-reminder-controls.test.mjs
