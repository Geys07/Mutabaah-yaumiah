name: Auto merge validated PR

on:
  workflow_run:
    workflows: ["UI checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge successful PR into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          prs="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == env.HEAD_SHA)] | .[].number')"
          if [ -z "$prs" ]; then
            echo "No matching open PR to main; skipping."
            exit 0
          fi
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            echo "Merging validated PR #$pr at $HEAD_SHA"
            gh api --method PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$HEAD_SHA"
          done <<< "$prs"
