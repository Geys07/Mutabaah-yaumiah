name: Render notification badge for review
on:
  push:
    branches: [fix/notification-popovers-and-png-statusbar-20261022]
    paths:
      - scripts/render-notification-badge.py
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render PNG and return the generated bytes for the PR asset
        env:
          EMIT_BADGE_BASE64: '1'
        run: python scripts/render-notification-badge.py
